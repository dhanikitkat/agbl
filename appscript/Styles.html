<style>
:root {
    --bg: #f3efe8;
    --bg-deep: #e7e0d4;
    --ink: #1c1915;
    --muted: #6b6358;
    --brand: #b42318;
    --brand-dark: #8f1a12;
    --accent: #2f6b4f;
    --card: rgba(255, 252, 247, 0.92);
    --line: rgba(28, 25, 21, 0.1);
    --ok: #1f7a4c;
    --warn: #a16207;
    --danger: #b42318;
    --shadow: 0 18px 40px rgba(28, 25, 21, 0.08);
    --radius: 18px;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Manrope", sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(180, 35, 24, 0.12), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(47, 107, 79, 0.12), transparent 50%),
      linear-gradient(180deg, #f7f3ec 0%, var(--bg) 45%, var(--bg-deep) 100%);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231c1915' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  a { color: inherit; }

  .app-shell {
    width: min(1120px, calc(100% - 1.5rem));
    margin: 0 auto;
    padding: 1rem 0 5rem;
    position: relative;
    z-index: 1;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.25rem;
    animation: rise 0.55s ease both;
  }

  .brand-block {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  .brand-name {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 4vw, 2.35rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0;
  }

  .brand-sub {
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.45rem 0.8rem;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .status-dot {
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 0 4px rgba(161, 98, 7, 0.15);
  }

  .status-pill.online .status-dot {
    background: var(--ok);
    box-shadow: 0 0 0 4px rgba(31, 122, 76, 0.15);
    animation: pulse 1.8s ease infinite;
  }

  .status-pill.offline .status-dot {
    background: var(--danger);
    box-shadow: 0 0 0 4px rgba(180, 35, 24, 0.12);
  }

  .hero-note {
    margin: 0 0 1.25rem;
    color: var(--muted);
    max-width: 36rem;
    animation: rise 0.65s ease both;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1rem;
    backdrop-filter: blur(8px);
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 1.35rem;
    margin: 0 0 0.85rem;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    animation: rise 0.7s ease both;
  }

  .menu-card {
    background: #fffdf9;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    min-height: 148px;
    overflow: hidden;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .menu-card:hover {
    transform: translateY(-2px);
    border-color: rgba(180, 35, 24, 0.25);
    box-shadow: 0 10px 24px rgba(28, 25, 21, 0.08);
  }

  .menu-photo {
    position: relative;
    aspect-ratio: 4 / 3;
    background:
      linear-gradient(145deg, #ebe4d8, #d9d0c2);
    overflow: hidden;
  }

  .menu-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }

  .menu-card:hover .menu-photo img {
    transform: scale(1.04);
  }

  .menu-photo.is-placeholder::after {
    content: "Foto menu";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(28, 25, 21, 0.45);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .menu-photo.is-placeholder img {
    opacity: 0;
  }

  .menu-card-body {
    padding: 0.85rem;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    flex: 1;
  }

  .menu-card h3 {
    margin: 0;
    font-size: 0.98rem;
    line-height: 1.25;
  }

  .menu-card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.35;
    flex: 1;
  }

  .menu-card .price {
    font-weight: 700;
    font-size: 0.92rem;
  }

  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    border-radius: 12px;
    padding: 0.65rem 1rem;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.92rem;
    transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }

  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .btn-primary {
    background: var(--brand);
    color: #fff;
  }
  .btn-primary:hover { background: var(--brand-dark); }

  .btn-secondary {
    background: #efe8dc;
    color: var(--ink);
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
  }

  .btn-danger {
    background: #f8e5e2;
    color: var(--danger);
  }

  .btn-sm {
    padding: 0.35rem 0.55rem;
    border-radius: 10px;
    font-size: 0.8rem;
  }

  .btn-icon {
    width: 2.1rem;
    height: 2.1rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  label {
    display: grid;
    gap: 0.35rem;
    font-size: 0.85rem;
    font-weight: 600;
  }

  input, select, textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.7rem 0.8rem;
    font: inherit;
    background: #fff;
    color: var(--ink);
  }

  input.is-invalid, select.is-invalid, textarea.is-invalid {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(180, 35, 24, 0.12);
  }

  .hint {
    color: var(--danger);
    font-size: 0.75rem;
    font-weight: 500;
    display: none;
  }

  .is-invalid + .hint, .field-error .hint { display: block; }

  .order-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  .order-table th, .order-table td {
    padding: 0.65rem 0.35rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: middle;
  }

  .order-table th {
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .qty-actions {
    display: inline-flex;
    gap: 0.3rem;
  }

  .grand-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.85rem;
    padding-top: 0.85rem;
    border-top: 1px dashed var(--line);
    font-size: 1.05rem;
    font-weight: 800;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem;
    margin-top: 1rem;
  }

  .payment-box {
    margin-top: 1rem;
    display: grid;
    gap: 0.55rem;
    padding: 0.9rem;
    border-radius: 14px;
    background: #f7f1e8;
    border: 1px solid var(--line);
  }

  .payment-box h4 {
    margin: 0;
    font-family: var(--font-display);
  }

  .payment-box p {
    margin: 0;
    font-size: 0.88rem;
    color: var(--ink);
  }

  .qris-wrap {
    margin-top: 0.35rem;
    text-align: center;
  }

  .qris-wrap img {
    width: min(220px, 70vw);
    border-radius: 12px;
    border: 1px solid var(--line);
    background: #fff;
  }

  .toast-host {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 9999;
    display: grid;
    gap: 0.5rem;
    width: min(340px, calc(100% - 2rem));
  }

  .toast {
    background: #1c1915;
    color: #fff;
    padding: 0.85rem 1rem;
    border-radius: 14px;
    box-shadow: var(--shadow);
    animation: slideIn 0.28s ease both;
    font-size: 0.9rem;
  }

  .toast.ok { background: #163d2b; }
  .toast.warn { background: #5c3d08; }
  .toast.err { background: #5c1611; }

  .sync-banner {
    display: none;
    margin-bottom: 0.85rem;
    padding: 0.7rem 0.9rem;
    border-radius: 12px;
    background: #fff7e6;
    border: 1px solid rgba(161, 98, 7, 0.25);
    color: #5c3d08;
    font-size: 0.88rem;
    animation: rise 0.4s ease both;
  }

  .sync-banner.show { display: block; }

  .nav-links {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .nav-links a, .nav-links button {
    text-decoration: none;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .stat-card {
    padding: 0.9rem;
    border-radius: 14px;
    background: #fffdf9;
    border: 1px solid var(--line);
  }

  .stat-card span {
    display: block;
    color: var(--muted);
    font-size: 0.78rem;
    margin-bottom: 0.25rem;
  }

  .stat-card strong {
    font-size: 1.25rem;
    font-family: var(--font-display);
  }

  .login-wrap {
    max-width: 420px;
    margin: 8vh auto 0;
    animation: rise 0.5s ease both;
  }

  .empty {
    color: var(--muted);
    font-size: 0.92rem;
    padding: 0.75rem 0;
  }

  .tabs {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .tab {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
  }

  .tab.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .hidden { display: none !important; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @media (max-width: 720px) {
    .form-grid { grid-template-columns: 1fr; }
    .menu-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .order-table { font-size: 0.8rem; }
    .actions { flex-direction: column; }
    .actions .btn { width: 100%; }
  }
</style>
